name: .NET CI

on:
  push:
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Cache de pacotes NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restaurar dependências
        run: dotnet restore ProjetoFinanceiro.sln

      - name: Build
        run: dotnet build ProjetoFinanceiro.sln --configuration Release --no-restore

      - name: Rodar testes (se existir projeto de teste)
        run: |
          if find . -iname "*Tests.csproj" -o -iname "*.Tests.csproj" | grep -q .; then
            dotnet test ProjetoFinanceiro.sln --configuration Release --no-build --verbosity normal
          else
            echo "Nenhum projeto de testes encontrado ainda — pulando dotnet test."
          fi
